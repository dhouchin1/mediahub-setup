{% extends "base.html" %}

{% block title %}{{ title }} — MediaHub Setup{% endblock %}

{% block content %}
<div class="glass rounded-3xl p-8 sm:p-10 shadow-2xl">
  <div class="text-xs uppercase tracking-wider text-violet-300 font-semibold mb-2">Coming soon</div>
  <h1 class="text-3xl font-bold mb-3">{{ title }}</h1>
  <p class="text-slate-300 mb-8">{{ message }}</p>

  <div class="flex items-center justify-between pt-4 border-t border-slate-700/50">
    <a href="javascript:history.back()" class="px-4 py-2 text-sm rounded-lg text-slate-400 hover:text-slate-200 transition">Back</a>
    {% if next_step %}
    <a href="{{ url_for(next_step + '.index') }}"
       class="inline-flex items-center gap-2 px-5 py-2 rounded-lg font-medium bg-gradient-to-r from-violet-500 to-pink-500 text-white shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 transition">
      Skip ahead
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
      </svg>
    </a>
    {% endif %}
  </div>
</div>
{% endblock %}
