name: Publish to PyPI

# Triggers on a GitHub Release being published.
# Uses OIDC trusted publishing — no PyPI API token needed in secrets.
# Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Publisher:  dhouchin1/mediahub-setup
#   Workflow:   publish.yml
#   Environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hatch
        run: pip install hatch

      - name: Build sdist + wheel
        run: hatch build

      - name: Check distribution
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
